services:
  api:
    image: ${APP_IMAGE:?APP_IMAGE required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      APP_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION required}
      DB_PATH: /data/tasks.db
      FAILURE_FLAG: /tmp/taskpulse-unhealthy
    volumes:
      - staging_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 8
volumes:
  staging_data:
