[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
[tool.coverage.run]
source = ["app"]
branch = true
[tool.coverage.report]
fail_under = 85
show_missing = true
omit = ["app/__init__.py"]
[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S104", "S311"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
