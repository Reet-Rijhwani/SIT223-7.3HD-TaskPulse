global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: taskpulse-production
    metrics_path: /metrics
    static_configs:
      - targets: ["taskpulse-prod-api-1:8000"]
  - job_name: taskpulse-production-readiness
    metrics_path: /metrics/ready
    static_configs:
      - targets: ["taskpulse-prod-api-1:8000"]
